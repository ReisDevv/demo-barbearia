<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Imperium Barbershop | Vila Rosália e Vila Galvão, Guarulhos</title>
<meta name="description" content="Imperium Barbershop: Nota 5,0 no Google. Agende seu horário em 30 segundos. R. Francisco Pereira, 27 - Vila Galvão, Guarulhos - SP. Agende pelo WhatsApp.">
<meta name="robots" content="noindex, nofollow">
<meta property="og:type" content="website">
<meta property="og:title" content="Imperium Barbershop">
<meta property="og:description" content="Nota 5,0 no Google. Agende seu horário em 30 segundos. Escolha o serviço e o horário e confirme pelo WhatsApp.">
<meta name="theme-color" content="#d4af37">
<script type="application/ld+json">{"@context":"https://schema.org","@type":"BarberShop","name":"Imperium Barbershop","address":"R. Francisco Pereira, 27 - Vila Galvão, Guarulhos - SP","telephone":"+5511947402392","url":"https://reisdevv.github.io/demo-barbearia/previas/imperium/"}</script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&display=swap" rel="stylesheet">
<style>
  :root { --cor: #c8a165; --fundo: #121212; --card: #1d1d1d; --texto: #f2f2f2; --suave: #a8a8a8; }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: Inter, system-ui, sans-serif; background: var(--fundo); color: var(--texto); line-height: 1.5; }
  a { color: inherit; }
  .wrap { max-width: 960px; margin: 0 auto; padding: 0 20px; }
  header { padding: 72px 0 56px; background: radial-gradient(circle at 80% 0%, color-mix(in srgb, var(--cor) 35%, transparent), transparent 60%); }
  .selo { display: inline-block; font-size: .85rem; color: var(--suave); border: 1px solid #333; border-radius: 99px; padding: 4px 12px; margin-bottom: 18px; }
  h1 { font-size: clamp(2.2rem, 7vw, 3.6rem); font-weight: 800; line-height: 1.1; }
  .slogan { color: var(--suave); font-size: 1.15rem; margin: 14px 0 28px; max-width: 34ch; }
  .btn { display: inline-flex; align-items: center; gap: 10px; background: var(--cor); color: #111; font-weight: 800; text-decoration: none; border: 0; border-radius: 12px; padding: 14px 22px; font-size: 1rem; cursor: pointer; }
  .btn:focus-visible, select:focus-visible, input:focus-visible { outline: 3px solid #fff; outline-offset: 2px; }
  .btn.sec { background: transparent; color: var(--texto); border: 1px solid #444; }
  .acoes { display: flex; flex-wrap: wrap; gap: 12px; }
  section { padding: 48px 0; border-top: 1px solid #222; }
  h2 { font-size: 1.6rem; margin-bottom: 20px; }
  .grade { display: grid; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); gap: 14px; }
  .card { background: var(--card); border-radius: 14px; padding: 18px; }
  .serv { display: flex; justify-content: space-between; align-items: center; gap: 12px; }
  .serv small { color: var(--suave); display: block; }
  .preco { color: var(--cor); font-weight: 800; white-space: nowrap; }
  form { display: grid; gap: 12px; max-width: 460px; }
  label { font-size: .9rem; color: var(--suave); display: grid; gap: 6px; }
  select, input { font: inherit; background: var(--card); color: var(--texto); border: 1px solid #333; border-radius: 10px; padding: 12px; }
  .horarios li { list-style: none; display: flex; justify-content: space-between; padding: 8px 0; border-bottom: 1px dashed #2c2c2c; }
  .depo p { font-style: italic; } .depo span { color: var(--suave); font-size: .9rem; }
  iframe { width: 100%; height: 300px; border: 0; border-radius: 14px; filter: grayscale(.3); }
  footer { padding: 32px 0 96px; color: var(--suave); font-size: .85rem; text-align: center; }
  .flutuante { position: fixed; right: 18px; bottom: 18px; width: 60px; height: 60px; border-radius: 50%; background: #25d366; display: grid; place-items: center; box-shadow: 0 6px 20px #0008; }
  .flutuante svg { width: 32px; height: 32px; fill: #fff; }
</style>
</head>
<body>
<header>
  <div class="wrap">
    <span class="selo" id="nota"></span>
    <h1 id="nome"></h1>
    <p class="slogan" id="slogan"></p>
    <div class="acoes">
      <a class="btn" href="#agendar">Agendar horário</a>
      <a class="btn sec" id="btnRota" target="_blank" rel="noopener">Como chegar</a>
    </div>
  </div>
</header>

<main>
  <section><div class="wrap">
    <h2>Serviços e preços</h2>
    <div class="grade" id="servicos"></div>
  </div></section>

  <section id="agendar"><div class="wrap">
    <h2>Agende em 30 segundos</h2>
    <form id="form">
      <label>Serviço <select id="fServico" required></select></label>
      <label>Dia <input type="date" id="fDia" required></label>
      <label>Horário preferido <select id="fHora" required></select></label>
      <label>Seu nome <input id="fNome" autocomplete="given-name" required></label>
      <button class="btn" type="submit">Confirmar pelo WhatsApp</button>
    </form>
  </div></section>

  <section><div class="wrap grade">
    <div>
      <h2>Horário de funcionamento</h2>
      <ul class="horarios" id="horarios"></ul>
    </div>
    <div>
      <h2>Onde estamos</h2>
      <p id="endereco" style="margin-bottom:12px"></p>
      <iframe id="mapa" title="Mapa com a localização" loading="lazy"></iframe>
    </div>
  </div></section>

  <section id="secDepo"><div class="wrap">
    <h2>O que dizem os clientes</h2>
    <div class="grade" id="depoimentos"></div>
  </div></section>
</main>

<footer><div class="wrap" id="rodape"></div></footer>
<a class="flutuante" id="zap" target="_blank" rel="noopener" aria-label="Falar no WhatsApp">
  <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 2a10 10 0 0 0-8.6 15.1L2 22l5-1.3A10 10 0 1 0 12 2zm0 18.2a8.2 8.2 0 0 1-4.2-1.2l-.3-.2-3 .8.8-2.9-.2-.3A8.2 8.2 0 1 1 12 20.2zm4.5-6.1c-.2-.1-1.5-.7-1.7-.8-.2-.1-.4-.1-.6.1l-.8 1c-.1.2-.3.2-.5.1a6.7 6.7 0 0 1-3.3-2.9c-.2-.4.2-.4.7-1.3.1-.2 0-.3 0-.4l-.8-1.8c-.2-.5-.4-.4-.6-.4h-.5a1 1 0 0 0-.7.3 3 3 0 0 0-.9 2.2 5.2 5.2 0 0 0 1.1 2.7 11.8 11.8 0 0 0 4.5 4c1.7.7 2.3.8 3.2.6.5-.1 1.5-.6 1.7-1.2.2-.6.2-1.1.2-1.2-.1-.1-.3-.2-.5-.3z"/></svg>
</a>

<script>
// ===== Tudo que muda de um cliente para outro fica aqui =====
const CONFIG = {
  "cor": "#d4af37",
  "horarios": [
    [
      "Ter a sex",
      "09h às 20h"
    ],
    [
      "Sábado",
      "08h às 18h"
    ],
    [
      "Dom e seg",
      "Fechado"
    ]
  ],
  "horasAgenda": [
    "09:00",
    "10:00",
    "11:00",
    "13:00",
    "14:00",
    "15:00",
    "16:00",
    "17:00",
    "18:00",
    "19:00"
  ],
  "servicos": [
    {
      "nome": "Corte",
      "detalhe": "máquina e tesoura",
      "preco": "R$ 45"
    },
    {
      "nome": "Barba",
      "detalhe": "toalha quente e navalha",
      "preco": "R$ 35"
    },
    {
      "nome": "Corte + barba",
      "detalhe": "o combo mais pedido",
      "preco": "R$ 70"
    },
    {
      "nome": "Pezinho / acabamento",
      "detalhe": "entre um corte e outro",
      "preco": "R$ 15"
    },
    {
      "nome": "Sobrancelha",
      "detalhe": "navalha",
      "preco": "R$ 15"
    },
    {
      "nome": "Infantil",
      "detalhe": "até 12 anos",
      "preco": "R$ 40"
    }
  ],
  "depoimentos": [],
  "rodape": "Prévia de site",
  "linkAgenda": "",
  "nome": "Imperium Barbershop",
  "slogan": "Nota 5,0 no Google. Agende seu horário em 30 segundos.",
  "whatsapp": "5511947402392",
  "endereco": "R. Francisco Pereira, 27 - Vila Galvão, Guarulhos - SP",
  "nota": "5,0 no Google · 163 avaliações",
  "demo": "Prévia de site feita para Imperium Barbershop. Ainda não é o site oficial."
};
// ============================================================

const $ = id => document.getElementById(id);
const zap = msg => `https://wa.me/${CONFIG.whatsapp}?text=${encodeURIComponent(msg)}`;
const esc = s => String(s).replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));

document.title = CONFIG.nome;
document.documentElement.style.setProperty("--cor", CONFIG.cor);
$("nome").textContent = CONFIG.nome;
$("slogan").textContent = CONFIG.slogan;
$("nota").textContent = "★ " + CONFIG.nota;
$("endereco").textContent = CONFIG.endereco;
$("rodape").textContent = `${CONFIG.nome} · ${CONFIG.endereco} · ${CONFIG.rodape}`;
const q = encodeURIComponent(CONFIG.endereco);
$("mapa").src = `https://www.google.com/maps?q=${q}&output=embed`;
$("btnRota").href = `https://www.google.com/maps/dir/?api=1&destination=${q}`;
$("zap").href = zap(`Olá, ${CONFIG.nome}! Vim pelo site.`);

$("servicos").innerHTML = CONFIG.servicos.map(s => `
  <div class="card serv"><div><strong>${esc(s.nome)}</strong><small>${esc(s.detalhe)}</small></div>
  <span class="preco">${esc(s.preco)}</span></div>`).join("");
$("horarios").innerHTML = CONFIG.horarios.map(([d, h]) => `<li><span>${esc(d)}</span><strong>${esc(h)}</strong></li>`).join("");
$("depoimentos").innerHTML = CONFIG.depoimentos.map(([t, a]) => `<div class="card depo"><p>“${esc(t)}”</p><span>— ${esc(a)}</span></div>`).join("");
if (!CONFIG.depoimentos.length) $("secDepo").remove();
if (CONFIG.demo) {
  document.head.insertAdjacentHTML("beforeend", '<meta name="robots" content="noindex, nofollow">');
  document.body.insertAdjacentHTML("afterbegin", `<div style="background:#ffd54a;color:#111;text-align:center;padding:8px;font-size:.9rem;font-weight:600">${esc(CONFIG.demo)}</div>`);
}
$("fServico").innerHTML = CONFIG.servicos.map(s => `<option>${esc(s.nome)} (${esc(s.preco)})</option>`).join("");
$("fHora").innerHTML = CONFIG.horasAgenda.map(h => `<option>${h}</option>`).join("");
const hoje = new Date(); hoje.setMinutes(hoje.getMinutes() - hoje.getTimezoneOffset());
$("fDia").min = $("fDia").value = hoje.toISOString().slice(0, 10);

if (CONFIG.linkAgenda) {
  $("agendar").remove();
  const b = document.querySelector('a[href="#agendar"]');
  b.href = CONFIG.linkAgenda; b.target = "_blank"; b.rel = "noopener";
}

$("form")?.addEventListener("submit", e => {
  e.preventDefault();
  const dia = $("fDia").value.split("-").reverse().join("/");
  window.open(zap(`Olá! Sou ${$("fNome").value.trim()} e quero agendar:\n• ${$("fServico").value}\n• Dia ${dia} às ${$("fHora").value}\nPode confirmar?`), "_blank", "noopener");
});
</script>
</body>
</html>
